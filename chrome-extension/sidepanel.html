<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TruthLens Panel</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .tlx-sidepanel {
        padding: 16px;
        min-height: 100vh;
        background: #f6f8fc;
        color: #1f2937;
      }
      .tlx-sidepanel-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .tlx-sidepanel-content {
        background: #fff;
        border: 1px solid #e5eaf2;
        border-radius: 14px;
        padding: 24px;
        min-height: 200px;
      }
    </style>
  </head>
  <body>
    <div class="tlx-sidepanel">
      <header class="tlx-sidepanel-header">
        <div class="tlx-logo" aria-hidden="true">TL</div>
        <div>
          <h1 style="margin:0;font-size:17px;">TruthLens</h1>
          <p style="margin:4px 0 0;font-size:12px;color:#64748b;">Panel</p>
        </div>
      </header>
      <main class="tlx-sidepanel-content">
        <!-- Blank panel – add content here later -->
      </main>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
