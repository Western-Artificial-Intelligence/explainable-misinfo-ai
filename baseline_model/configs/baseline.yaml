model:
  backbone: roberta-base
  max_length: 256
  lambda_adv: 0.5

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05

training:
  batch_size: 16
  lr: 1e-4
  epochs: 2
  weight_decay: 0.01
  seed: 42
  device: auto
  grad_accum_steps: 1
  save_every_epoch: true

data:
  dataset_path: ../data/merged_dataset   # relative to baseline_model/
  create_synthetic_if_missing: true

output:
  base_dir: ../baseline_outputs